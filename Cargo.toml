[workspace]
resolver = "2"
members = ["crates/neural-core","crates/neural-app","crates/neural-setup"]

[workspace.package]
version = "2.1.8"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/JoseRFJuniorLLMs/NeuralIA"
authors = ["Jose Ribamar Ferreira Junior"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
url = { version = "2.5.8", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
