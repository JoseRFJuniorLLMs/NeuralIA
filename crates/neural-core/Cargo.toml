[package]
name = "neural-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Nenhuma feature por omissao: o exe publicado usa o neural-core assim.
default = []
# So CI e testes (infra-settings-keys, plano 2.3): expoe
# `json_store::StoreRegistry::mint_for_test`, o registo das lojas sobre uma
# pasta de teste sem gastar a cunhagem unica do processo. Ligada apenas nas
# `[dev-dependencies]` do neural-app; o exe publicado e compilado sem ela
# (passo "Published exe has the test-stores feature off" do ci.yml e
# scripts/test-release-contract.mjs). Nao puxa crate nenhuma.
test-stores = []

[dev-dependencies]
# O teste de proveniência confere o SHA-256 dos ficheiros vendorizados.
sha2 = "0.10.9"

[dependencies]
# EPUB: inflate das entradas do ZIP e parser do OPF/NCX/nav. Os dois já
# estavam no Cargo.lock como transitivos; nenhum crate novo entra.
flate2 = "1.1.10"
quick-xml = { version = "0.41.0", default-features = false }
scraper = "0.27"
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10.9"
thiserror.workspace = true
ureq = { version = "3.4", features = ["charset", "brotli", "platform-verifier"] }
url.workspace = true
