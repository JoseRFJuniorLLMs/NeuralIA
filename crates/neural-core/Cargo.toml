[package]
name = "neural-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
# O teste de proveniência confere o SHA-256 dos ficheiros vendorizados.
sha2 = "0.11.0"

[dependencies]
# EPUB: inflate das entradas do ZIP e parser do OPF/NCX/nav. Os dois já
# estavam no Cargo.lock como transitivos; nenhum crate novo entra.
flate2 = "1.1.10"
quick-xml = { version = "0.41.0", default-features = false }
scraper = "0.27"
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.11.0"
thiserror.workspace = true
ureq = { version = "3.4", features = ["charset", "brotli", "platform-verifier"] }
url.workspace = true
