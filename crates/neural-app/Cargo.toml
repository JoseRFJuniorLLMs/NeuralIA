[package]
name = "neural-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "NeuralIA"
path = "src/main.rs"

# Gera assets/logo.ico e assets/neuralia-home-reader.png a partir de
# assets/neuralia-home.png (ver scripts/brand-assets/brand.rs). Vive em
# scripts/ e usa o `image` que o produto ja tem: nao entra crate nenhuma.
[[example]]
name = "brand-assets"
path = "../../scripts/brand-assets/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
neural-core = { path = "../neural-core" }
# O parser do canal IPC (src/ipc.rs) é portátil e é compilado em todas as
# plataformas; por isso o serde_json não pode ficar só no lado Windows.
serde_json.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
winit = "0.30"
wry = { version = "0.57", features = ["devtools"] }
# Os bindings COM do WebView2 que o wry 0.57 JA puxa, nas versoes exatas do
# Cargo.lock: nomea-los aqui nao acrescenta crate nenhuma a arvore (gate
# `webview2_bindings_add_no_crate_to_the_lock`). O wry nao expoe o evento
# ContextMenuRequested (ICoreWebView2_11); sem estes nomes o item "rolagem
# automatica" do botao direito das colunas nao se consegue registar.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(windows)'.dev-dependencies]
# So para os testes lerem o recurso de icone do NeuralIA.exe compilado
# (tests/brand_assets.rs); a mesma windows-sys do Cargo.lock.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"
