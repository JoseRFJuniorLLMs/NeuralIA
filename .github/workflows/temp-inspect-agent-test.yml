name: TEMP patch legacy agent test
on:
  push:
    branches: [fix/spec-0104-untrusted-risk-floor]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/spec-0104-untrusted-risk-floor
      - name: Update legacy click gate to the Class-C contract
        shell: python
        run: |
          from pathlib import Path
          p=Path('crates/neural-app/src/windows_app/tests.rs')
          s=p.read_text(encoding='utf-8')
          old_name='fn reversible_click_runs_under_the_session_grant'
          if old_name not in s:
              print('legacy gate already migrated')
              raise SystemExit(0)
          start=s.index(old_name)
          brace=s.index('{',start)
          depth=0
          end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          if end is None: raise RuntimeError('unbalanced legacy test')
          body=s[start:end]
          needle='assert_eq!(act.confirmation, None);'
          if body.count(needle) != 1:
              raise RuntimeError(f'confirmation anchor count={body.count(needle)}')
          body=body.replace(old_name, 'fn generic_click_requires_confirmation_even_with_reversible_session_grant', 1)
          body=body.replace(needle, 'assert_eq!(\\n            act.confirmation.as_deref(),\\n            Some("sensitive remote-state change")\\n        );', 1)
          p.write_text(s[:start]+body+s[end:], encoding='utf-8', newline='\\n')
      - name: Commit migrated gate when needed
        shell: bash
        run: |
          if git diff --quiet -- crates/neural-app/src/windows_app/tests.rs; then
            echo 'no patch needed'
            exit 0
          fi
          git config user.name 'NeuralIA gate maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/neural-app/src/windows_app/tests.rs
          git commit -m 'test(agent-security): migrate legacy generic-click expectation'
          git push origin HEAD:fix/spec-0104-untrusted-risk-floor
