name: Windows release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - id: version
        name: Resolve release identity from CI-tested source
        shell: pwsh
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$env:TESTED_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download the exact binary measured by the triggering CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neuralia-windows-tested-${{ github.event.workflow_run.head_sha }}
          path: ci-tested
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify the CI-tested binary checksum
        shell: pwsh
        run: |
          $line = (Get-Content ci-tested/NeuralIA.exe.sha256 -Raw).Trim()
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash ci-tested/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "CI-tested NeuralIA.exe checksum mismatch: expected $expected, got $actual"
          }
      - name: Build release installer and sign it when Authenticode credentials are configured
        shell: pwsh
        env:
          NEURALIA_AUTHENTICODE_PFX_B64: ${{ secrets.NEURALIA_AUTHENTICODE_PFX_B64 }}
          NEURALIA_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.NEURALIA_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:NEURALIA_AUTHENTICODE_PFX_B64)
          $hasPfxSecret = -not [string]::IsNullOrWhiteSpace($env:NEURALIA_AUTHENTICODE_PFX_PASSWORD)

          if ($hasPfx -xor $hasPfxSecret) {
            throw "Authenticode configuration is incomplete: both PFX and password secrets are required."
          }

          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value

          if ($hasPfx) {
            ./scripts/build-windows-installer.ps1 -ExePath ci-tested/NeuralIA.exe -Version $version -OutputDir release-installer -Sign
          }
          else {
            Write-Host "Authenticode certificate is not configured; publishing the tested unsigned installer instead of omitting installation entirely."
            ./scripts/build-windows-installer.ps1 -ExePath ci-tested/NeuralIA.exe -Version $version -OutputDir release-installer
          }

          $installer = Get-ChildItem release-installer -Filter "NeuralIA-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Release installer was not produced." }

          if ($hasPfx) {
            ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedExePath ci-tested/NeuralIA.exe -ExpectedVersion $version -RequireValidSignature
          }
          else {
            ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedExePath ci-tested/NeuralIA.exe -ExpectedVersion $version
          }

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path crates/neural-app/Cargo.toml --format json --target x86_64-pc-windows-msvc --spec-version 1.5
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ci-tested/NeuralIA.exe dist/NeuralIA.exe
          Copy-Item ci-tested/perf-home.json dist/perf-home.json
          Copy-Item ci-tested/perf-cycles.json dist/perf-cycles.json

          $installer = Get-ChildItem release-installer -Filter "NeuralIA-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Release installer is mandatory but was not found."
          }
          Copy-Item $installer.FullName dist/$($installer.Name)
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$installerHash  $($installer.Name)" | Out-File -Encoding ascii "dist/$($installer.Name).sha256"

          $sbom = Get-ChildItem crates/neural-app -File -Filter "*.json" |
            Where-Object { $_.Name -match "bom|cdx|cyclonedx" } |
            Select-Object -First 1
          if (-not $sbom) {
            throw "CycloneDX JSON was not generated next to crates/neural-app/Cargo.toml"
          }

          $document = Get-Content $sbom.FullName -Raw | ConvertFrom-Json
          $pdfjs = [pscustomobject]@{
            type = "library"
            name = "pdf.js"
            version = "6.3.289"
            licenses = @([pscustomobject]@{
              license = [pscustomobject]@{ id = "Apache-2.0" }
            })
            properties = @(
              [pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/pdf.mjs" },
              [pscustomobject]@{ name = "neuralia:worker"; value = "assets/pdfjs/pdf.worker.mjs" },
              [pscustomobject]@{ name = "neuralia:auxiliary-manifest"; value = "assets/pdfjs/AUXILIARY_BLOBS.md" }
            )
          }
          $pdfjsAuxiliary = @(
            [pscustomobject]@{
              type = "library"; name = "pdf.js OpenJPEG decoder"; version = "6.3.289"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ id = "BSD-2-Clause" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/wasm/openjpeg.wasm" })
            },
            [pscustomobject]@{
              type = "library"; name = "pdf.js JBIG2 decoder"; version = "6.3.289"
              licenses = @(
                [pscustomobject]@{ license = [pscustomobject]@{ id = "BSD-3-Clause" } },
                [pscustomobject]@{ license = [pscustomobject]@{ id = "Apache-2.0" } }
              )
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/wasm/jbig2.wasm" })
            },
            [pscustomobject]@{
              type = "library"; name = "pdf.js QCMS decoder"; version = "6.3.289"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ id = "MIT" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/wasm/qcms_bg.wasm" })
            },
            [pscustomobject]@{
              type = "data"; name = "Adobe binary CMaps"; version = "pdf.js-6.3.289"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ name = "Adobe BSD-style CMap license" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/cmaps/" })
            },
            [pscustomobject]@{
              type = "library"; name = "Foxit standard fonts"; version = "pdf.js-6.3.289"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ name = "PDFium/Foxit BSD-style license" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/standard_fonts/" })
            },
            [pscustomobject]@{
              type = "library"; name = "Liberation Sans"; version = "1.07.4"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ name = "GPLv2 with Liberation font exception" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/standard_fonts/LiberationSans-Regular.ttf" })
            },
            [pscustomobject]@{
              type = "data"; name = "CGATS001Compat-v2-micro ICC profile"; version = "bdd84663061bc4ae95ca70decff54f581e27f702"
              licenses = @([pscustomobject]@{ license = [pscustomobject]@{ id = "CC0-1.0" } })
              properties = @([pscustomobject]@{ name = "neuralia:vendored"; value = "assets/pdfjs/icc/CGATS001Compat-v2-micro.icc" })
            }
          )
          if (-not $document.components) {
            $document | Add-Member -MemberType NoteProperty -Name components -Value @()
          }
          $document.components += @($pdfjs) + $pdfjsAuxiliary
          $document | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $sbom.FullName

          Copy-Item $sbom.FullName dist/NeuralIA.cdx.json
          $hash = (Get-FileHash dist/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii dist/NeuralIA.exe.sha256
          cargo metadata --locked --format-version 1 --no-deps | Out-File -Encoding utf8 dist/cargo-metadata.json
      - name: Attest the exact release executable
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/NeuralIA.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NeuralIA-windows-x64-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: package
    if: needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.package.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: NeuralIA-windows-x64-${{ needs.package.outputs.tag }}
          path: dist
      - name: Create tag and stable release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          TESTED_SHA: ${{ needs.package.outputs.sha }}
        run: |
          set -euo pipefail

          tag_exists=0
          release_exists=0
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=1
          fi

          if [ "$tag_exists" -eq 1 ] && [ "$release_exists" -eq 1 ]; then
            echo "Stable release $RELEASE_TAG already exists; version is unchanged, nothing to publish."
            exit 0
          fi
          if [ "$tag_exists" -ne "$release_exists" ]; then
            echo "Inconsistent stable release state for $RELEASE_TAG (tag=$tag_exists release=$release_exists); refusing repair or overwrite." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TESTED_SHA" -m "NeuralIA $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

          gh release create "$RELEASE_TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "NeuralIA $RELEASE_TAG"             --generate-notes
