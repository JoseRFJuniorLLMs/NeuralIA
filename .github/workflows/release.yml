name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tag-stable-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Lock dependencies and create version tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi

          cargo generate-lockfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): lock dependencies for $tag"
          fi

          git tag -a "$tag" -m "NeuralIA $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"

  publish:
    needs: tag-stable-version
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Resolve and checkout release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            $version = $line.Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          git fetch --tags --force
          git checkout $tag
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build exact tagged source
        run: cargo build -p neural-app --release --locked
      - name: Rename artifact
        shell: pwsh
        run: Copy-Item target/release/neural-app.exe target/release/NeuralIA.exe
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii target/release/NeuralIA.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: NeuralIA-windows-x64
          path: |
            target/release/NeuralIA.exe
            target/release/NeuralIA.exe.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" target/release/NeuralIA.exe target/release/NeuralIA.exe.sha256 --clobber
          } else {
            gh release create "$env:RELEASE_TAG" target/release/NeuralIA.exe target/release/NeuralIA.exe.sha256 --verify-tag --title "NeuralIA $env:RELEASE_TAG" --generate-notes
          }
