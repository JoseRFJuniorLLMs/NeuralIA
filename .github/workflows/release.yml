name: Windows release build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p neural-app --release
      - uses: actions/upload-artifact@v4
        with:
          name: NeuralIA-windows-x64
          path: target/release/neural-app.exe
