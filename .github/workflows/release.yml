name: Windows release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  tag:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.version.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        name: Create tag only for a new workspace version
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"

          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')
          if [ -z "$remote_sha" ]; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
          fi

          if [ -n "$remote_sha" ]; then
            echo "Release tag $tag already exists; refusing to mutate or republish it."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$TESTED_SHA" -m "NeuralIA $tag"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - name: Verify tested source matches release tag version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match workspace version v$version"
          }
      - run: cargo test --locked -p neural-core
      - run: cargo clippy --locked -p neural-core --all-targets -- -D warnings
      - run: cargo clippy --locked -p neural-app -- -D warnings
      - name: Build exact CI-tested source
        run: cargo build --locked -p neural-app --release
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path crates/neural-app/Cargo.toml --format json --target x86_64-pc-windows-msvc --spec-version 1.5 --override-filename NeuralIA.cdx.json
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/neural-app.exe dist/NeuralIA.exe
          Copy-Item crates/neural-app/NeuralIA.cdx.json dist/NeuralIA.cdx.json
          $hash = (Get-FileHash dist/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii dist/NeuralIA.exe.sha256
          cargo metadata --locked --format-version 1 --no-deps | Out-File -Encoding utf8 dist/cargo-metadata.json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/NeuralIA.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NeuralIA-windows-x64-${{ needs.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.created == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NeuralIA-windows-x64-${{ needs.tag.outputs.tag }}
          path: dist
      - name: Create release once; never overwrite stable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "NeuralIA $RELEASE_TAG"             --generate-notes
