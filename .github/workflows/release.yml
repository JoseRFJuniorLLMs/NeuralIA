name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build
        run: cargo build -p neural-app --release
      - name: Rename artifact
        shell: pwsh
        run: Copy-Item target/release/neural-app.exe target/release/NeuralIA.exe
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii target/release/NeuralIA.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NeuralIA-windows-x64
          path: |
            target/release/NeuralIA.exe
            target/release/NeuralIA.exe.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/NeuralIA.exe target/release/NeuralIA.exe.sha256 --title "NeuralIA ${{ github.ref_name }}" --generate-notes
