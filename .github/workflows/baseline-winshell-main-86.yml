name: Baseline winshell main #86

on:
  push:
    branches: [test/baseline-winshell-main-86]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Reproduce shortcut round-trip baseline
        run: cargo test --locked -p neural-setup winshell::tests::a_shortcut_round_trips_through_the_hand_written_vtable -- --exact
