# EXPERIMENT ONLY (branch ci/first-paint-probe, never merged): measures the
# first comparator paint on fresh windows-latest runners, old gate vs new gate.
# Round 3: every msedgewebview2 process is suspended for 15 s as it appears
# (a WebView2 start slower than the old 12 s budget), on the shipped exe and
# on the sabotaged one.
name: first-paint-probe
on:
  push:
    branches: [ci/first-paint-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        exe: [shipped, sabotaged]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Break update_comparator_layout (columns 1 and 2 hidden)
        if: matrix.exe == 'sabotaged'
        shell: pwsh
        run: |
          $path = "crates/neural-app/src/windows_app/app/compare.rs"
          $src = [IO.File]::ReadAllText($path)
          $pattern = '(size: LogicalSize::new\(span\.width\.max\(1\.0\), content_h\)\.into\(\),\r?\n\s*\}\);\r?\n\s*)let _ = v\.webview\.set_visible\(true\);'
          $hits = [regex]::Matches($src, $pattern).Count
          if ($hits -ne 1) { throw "sabotage anchor matched $hits times" }
          $src = [regex]::Replace($src, $pattern, '${1}let _ = v.webview.set_visible(span.index == 0); // SABOTAGE')
          [IO.File]::WriteAllText($path, $src)
          Select-String -Path $path -Pattern "SABOTAGE"
      - run: cargo build --locked -p neural-app --bin NeuralIA --release
      - name: WebView2 held 15 s, old and new gate
        shell: pwsh
        run: ./scripts/experiment-first-paint.ps1 -ExePath target/release/NeuralIA.exe -OutDir first-paint-out -SkipFirst -StressRounds 0 -QuietRounds 0 -HeldRounds 3 -HoldSec 15
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: held-${{ matrix.exe }}-${{ matrix.shard }}
          path: first-paint-out
