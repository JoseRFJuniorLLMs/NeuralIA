name: Rebuild verified brand asset

on:
  push:
    branches: ["fix/brand-local-upload"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rebuild and verify NeuralIA brand image
        shell: bash
        run: |
          set -euo pipefail
          cat .brand-upload/part*.b64 | base64 -d > assets/neuralia-brand.jpg

          actual_size=$(wc -c < assets/neuralia-brand.jpg | tr -d ' ')
          test "$actual_size" = "21006"

          actual_sha=$(sha256sum assets/neuralia-brand.jpg | awk '{print $1}')
          test "$actual_sha" = "aefef8526a2f2b1ba279cb8ad1c22956a5424a8704e58963a031dcf9af88a40c"

          file assets/neuralia-brand.jpg
          rm -rf .brand-upload

          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace('src="assets/neuralia-brand.jpg" width="760"', 'src="assets/neuralia-brand.jpg" width="600"', 1)
          p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neuralia-brand.jpg README.md
          git add -u .brand-upload
          git commit -m "fix(brand): upload verified NeuralIA artwork"
          git push origin HEAD:"$GITHUB_REF_NAME"
