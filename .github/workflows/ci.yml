name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p neural-core
      # O parser do canal IPC (SPEC-0108) é portátil: compila e é testado aqui
      # também, não só no runner Windows. É a superfície mais sensível do
      # produto e não deve depender de um único sistema operativo para ter
      # cobertura.
      - run: cargo test --locked -p neural-app
      - run: cargo clippy --locked -p neural-core --all-targets -- -D warnings
      - run: cargo clippy --locked -p neural-app --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo check --locked --workspace
      - run: cargo test --locked -p neural-core
      - run: cargo test --locked -p neural-app
      - run: cargo clippy --locked -p neural-app --all-targets -- -D warnings
      - run: cargo build --locked -p neural-app --bin NeuralIA --release
      - name: Authenticode signer regression gate
        shell: pwsh
        run: ./scripts/test-authenticode.ps1 -ExePath target/release/NeuralIA.exe
      - name: Sign the release candidate when Authenticode is enabled
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEURALIA_AUTHENTICODE_ENABLED == 'true'
        shell: pwsh
        env:
          NEURALIA_AUTHENTICODE_PFX_B64: ${{ secrets.NEURALIA_AUTHENTICODE_PFX_B64 }}
          NEURALIA_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.NEURALIA_AUTHENTICODE_PFX_PASSWORD }}
          NEURALIA_AUTHENTICODE_TIMESTAMP_URL: ${{ vars.NEURALIA_AUTHENTICODE_TIMESTAMP_URL }}
          NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT: ${{ vars.NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT }}
        run: |
          $timestamp = $env:NEURALIA_AUTHENTICODE_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) {
            $timestamp = "http://timestamp.digicert.com"
          }
          ./scripts/sign-authenticode.ps1 `
            -ExePath target/release/NeuralIA.exe `
            -PfxBase64 $env:NEURALIA_AUTHENTICODE_PFX_B64 `
            -PfxPassword $env:NEURALIA_AUTHENTICODE_PFX_PASSWORD `
            -TimestampUrl $timestamp `
            -ExpectedSubject $env:NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT
      - name: Verify the signed release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEURALIA_AUTHENTICODE_ENABLED == 'true'
        shell: pwsh
        env:
          NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT: ${{ vars.NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT }}
        run: |
          ./scripts/verify-authenticode.ps1 `
            -ExePath target/release/NeuralIA.exe `
            -ExpectedSubject $env:NEURALIA_AUTHENTICODE_EXPECTED_SUBJECT `
            -RequireTimestamp
      - name: Native Home performance regression gate
        shell: pwsh
        run: ./scripts/measure-home.ps1 -ExePath target/release/NeuralIA.exe -OutputPath perf-home.json
      - name: WebView lifecycle regression gate
        shell: pwsh
        run: ./scripts/measure-cycles.ps1 -ExePath target/release/NeuralIA.exe -Cycles 5 -OutputPath perf-cycles.json
      - name: Stage the exact tested release candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-tested | Out-Null
          Copy-Item target/release/NeuralIA.exe ci-tested/NeuralIA.exe
          Copy-Item perf-home.json ci-tested/perf-home.json
          Copy-Item perf-cycles.json ci-tested/perf-cycles.json
          $hash = (Get-FileHash ci-tested/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii ci-tested/NeuralIA.exe.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neuralia-windows-tested-${{ github.sha }}
          path: ci-tested/
          if-no-files-found: error
          retention-days: 7

  attest-tested-binary:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: neuralia-windows-tested-${{ github.sha }}
          path: ci-tested
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ci-tested/NeuralIA.exe

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check bans licenses sources
          arguments: --all-features --locked
