name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - run: cargo test -p neural-core
      - run: cargo clippy -p neural-core --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - run: cargo check --workspace
      - run: cargo test -p neural-core
      - run: cargo clippy -p neural-app -- -D warnings
