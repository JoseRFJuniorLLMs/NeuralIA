name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p neural-core
      - run: cargo clippy --locked -p neural-core --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo check --locked --workspace
      - run: cargo test --locked -p neural-core
      - run: cargo test --locked -p neural-app
      - run: cargo clippy --locked -p neural-app --all-targets -- -D warnings
      - run: cargo build --locked -p neural-app --bin NeuralIA --release
      - name: Native Home performance regression gate
        shell: pwsh
        run: ./scripts/measure-home.ps1 -ExePath target/release/NeuralIA.exe -OutputPath perf-home.json
      # Informativo, ainda nao bloqueante: no runner a contagem de WebViews ja
      # deu zero com a aplicacao a consumir 13 MiB a mais, ou seja, o que falha
      # e a medicao e nao o produto. Passa a bloquear quando a medicao estiver
      # provada; o JSON fica no artefacto para se ver a cada corrida.
      - name: WebView lifecycle regression gate
        shell: pwsh
        continue-on-error: true
        run: ./scripts/measure-cycles.ps1 -ExePath target/release/NeuralIA.exe -Cycles 5 -OutputPath perf-cycles.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neuralia-home-performance
          path: |
            perf-home.json
            perf-cycles.json
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
