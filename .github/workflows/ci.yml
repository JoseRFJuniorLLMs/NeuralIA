name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - run: cargo check -p neural-core
      - run: cargo test -p neural-core
      - run: cargo clippy -p neural-core -- -D warnings

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p neural-core
      # O parser do canal IPC (SPEC-0108) é portátil: compila e é testado aqui
      # também, não só no runner Windows. É a superfície mais sensível do
      # produto e não deve depender de um único sistema operativo para ter
      # cobertura.
      - run: cargo test --locked -p neural-app
      - name: Exercise ChatGPT/Claude auto-submit runtime
        run: node scripts/test-ai-auto-submit.mjs
      - name: Exercise shipped provider link routing
        run: node scripts/test-link-routing.mjs
      - name: Verify release asset contract
        run: node scripts/test-release-contract.mjs
      - run: cargo clippy --locked -p neural-core --all-targets -- -D warnings
      - run: cargo clippy --locked -p neural-app --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    # 2.2.0 green runs already take 17-20 minutes (run 36163974196: 19m56s);
    # a run cut at the 20-minute mark after every step passed is a timeout,
    # not a gate result.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy,rustfmt
      # Gate normativo do AGENTS.md precisa do runner Windows porque
      # neural-setup e a aplicação Win32 fazem parte do workspace.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --locked --workspace
      - run: cargo test --locked -p neural-core
      - run: cargo test --locked -p neural-app
      - name: Prove 100-interaction UI gates reject sabotage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $defaultSourcePath = "crates/neural-app/src/windows_app.rs"
          $comparatorInjectPath = "crates/neural-app/src/windows_app/page_scripts.rs"
          $utf8 = [Text.UTF8Encoding]::new($false)

          function Write-Exact([string]$path, [string]$text) {
            [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path), $text, $utf8)
          }

          function Replace-Exact([string]$text, [string]$old, [string]$new, [string]$label) {
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) {
              throw "Sabotage target '$label' expected once, found $count."
            }
            return $text.Replace($old, $new)
          }

          # One cargo run; cargo progress on stderr must not abort the step.
          function Invoke-GateTest([string[]]$filter) {
            $ErrorActionPreference = "Continue"
            cargo test --locked -p neural-app @filter 2>&1 |
              ForEach-Object { "$_" } |
              Tee-Object -Variable lines |
              Write-Host
            return [pscustomobject]@{ Code = $LASTEXITCODE; Log = ($lines -join "`n") }
          }

          # libtest prints "test <path>::<name> ... ok|FAILED" for every test it runs,
          # so the name alone proves nothing: the outcome must be on the same line.
          function Test-ResultLine([string]$log, [string]$test, [string]$outcome) {
            $pattern = '(?m)^test (\S+::)?' + [regex]::Escape($test) + ' \.\.\. ' + $outcome + '\s*$'
            return $log -match $pattern
          }

          # Each sabotage is applied alone and only its gate runs, so every gate has
          # to turn red by itself. A build error or another failing test does not count.
          function Assert-GateRed([string]$label, [string]$test, [string]$targetPath, [string]$old, [string]$new) {
            $resolved = (Resolve-Path -LiteralPath $targetPath).Path
            $original = [IO.File]::ReadAllText($resolved, $utf8)
            $broken = Replace-Exact $original $old $new $label
            Write-Exact $resolved $broken
            try {
              $run = Invoke-GateTest @($test)
            }
            finally {
              Write-Exact $resolved $original
            }
            if ($run.Code -eq 0) {
              throw "Sabotage '$label' unexpectedly stayed green: $test"
            }
            if (-not (Test-ResultLine $run.Log $test 'FAILED')) {
              throw "Sabotage '$label' did not make its gate fail: $test"
            }
            Write-Host "Sabotage proof: '$label' turned $test red."
          }

          $sabotages = @(
            @{
              Label = "half-open-hit-test"
              Test = "ui_rect_edges_are_half_open_so_adjacent_controls_never_share_a_click"
              Old = @'
                      && x < self.x + self.width
                      && y >= self.y
                      && y < self.y + self.height
          '@
              New = @'
                      && x <= self.x + self.width
                      && y >= self.y
                      && y <= self.y + self.height
          '@
            },
            @{
              Label = "stale-split-generation"
              Test = "stale_split_builds_are_discarded_after_navigation_changes"
              SourcePath = "crates/neural-app/src/windows_app/app/split.rs"
              Old = @'
              start_generation == current_generation && surface == Surface::Comparator
          '@
              New = @'
              true
          '@
            },
            @{
              Label = "native-press-release"
              Test = "native_buttons_only_activate_when_press_and_release_match"
              Old = @'
              pressed.filter(|index| Some(*index) == released)
          '@
              New = @'
              released
          '@
            },
            @{
              Label = "join-current-group"
              Test = "current_group_is_not_offered_as_a_join_target"
              SourcePath = "crates/neural-app/src/windows_app/app/tabs.rs"
              Old = @'
                  .filter(|(_, group)| Some(group.id) != current_group)
          '@
              New = @'
                  .filter(|_| true)
          '@
            },
            @{
              Label = "global-digit-shortcut"
              Test = "keyboard_shortcuts_keep_page_identity_and_global_digit_targets"
              SourcePath = "crates/neural-app/src/windows_app/app/compare.rs"
              Old = @'
                      IpcAction::Fullscreen => Some(UserEvent::ExpandComparator(col_index)),
                      IpcAction::ShortcutExpand { col } => Some(UserEvent::ExpandComparator(col)),
          '@
              New = @'
                      IpcAction::Fullscreen => Some(UserEvent::ExpandComparator(col_index)),
                      IpcAction::ShortcutExpand { col } if col == col_index => {
                          Some(UserEvent::ExpandComparator(col))
                      }
          '@
            },
            @{
              Label = "split-transaction"
              Test = "failed_split_build_preserves_the_previous_split_and_expansion"
              SourcePath = "crates/neural-app/src/windows_app/app/split.rs"
              Old = @'
                  Err(error) => Err(error),
          '@
              New = @'
                  Err(error) => {
                      let _ = current_split.take();
                      *expanded = None;
                      Err(error)
                  },
          '@
            },
            @{
              Label = "capture-release-order"
              Test = "native_buttons_only_activate_when_press_and_release_match"
              Old = @'
              let index = pressed.swap(NATIVE_BUTTON_NONE, Ordering::AcqRel);
              release_capture();
          '@
              New = @'
              release_capture();
              let index = pressed.swap(NATIVE_BUTTON_NONE, Ordering::AcqRel);
          '@
            },
            @{
              Label = "caption-vertical-boundary"
              Test = "native_buttons_only_activate_when_press_and_release_match"
              Old = @'
              (captured && point_inside_client(width, height, x, y))
          '@
              New = @'
              (captured)
          '@
            },
            @{
              Label = "tab-save-stale-token"
              Test = "the_app_path_saves_restores_and_forgets_the_real_tabs_json"
              Old = @'
                  (token == self.sync.token).then(|| self.save_now(contexts, groups, split))
          '@
              New = @'
                  (token == self.sync.token.wrapping_add(1)).then(|| self.save_now(contexts, groups, split))
          '@
            },
            @{
              Label = "clear-history-keeps-tabs-json"
              Test = "the_app_path_saves_restores_and_forgets_the_real_tabs_json"
              Old = @'
                  let result = self.store.forget();
          '@
              New = @'
                  let result: std::io::Result<()> = Ok(());
          '@
            },
            @{
              Label = "menu-label-frozen-at-registration"
              Test = "each_right_click_reads_the_auto_scroll_state_and_routes_to_ctrl_r"
              Old = @'
              move |native| ColumnMenuRequest {
                  col_index,
                  label: auto_scroll_menu_label(auto_scroll.get()),
          '@
              New = @'
              let frozen = auto_scroll_menu_label(auto_scroll.get());
              move |native| ColumnMenuRequest {
                  col_index,
                  label: frozen,
          '@
            }
          )

          try {
            foreach ($sabotage in $sabotages) {
              $target = if ($sabotage.SourcePath) { $sabotage.SourcePath } else { $defaultSourcePath }
              Assert-GateRed $sabotage.Label $sabotage.Test $target $sabotage.Old $sabotage.New
            }
            Write-Host "Sabotage proof: each of the $($sabotages.Count) Rust UI sabotages turned its own shipped-path gate red."

            $jsTarget = if ($comparatorInjectPath) { $comparatorInjectPath } else { $defaultSourcePath }
            $resolvedJs = (Resolve-Path -LiteralPath $jsTarget).Path
            $originalJs = [IO.File]::ReadAllText($resolvedJs, $utf8)
            $brokenJs = Replace-Exact $originalJs @'
          '#neuralia-comp-controls,#neuralia-palette,a[href],button,input,textarea,select,option,label,summary,[role="button"],[role="link"],[contenteditable="true"]'
          '@ @'
          '#neuralia-comp-controls,#neuralia-palette,button,input,textarea,select,option,label,summary,[role="button"],[role="link"],[contenteditable="true"]'
          '@ "double-click-link-guard"
            Write-Exact $resolvedJs $brokenJs
            try {
              node scripts/test-link-routing.mjs
              $jsResult = $LASTEXITCODE
              if ($jsResult -eq 0) {
                throw "Double-click routing sabotage unexpectedly stayed green."
              }
              Write-Host "Sabotage proof: removing the link guard turns the runtime routing gate red."
            }
            finally {
              Write-Exact $resolvedJs $originalJs
            }
          }
          finally {
            git checkout -- crates/neural-app/src
          }

          cargo fmt --all -- --check
          $restored = Invoke-GateTest @()
          if ($restored.Code -ne 0) {
            throw "neural-app tests are not green on the restored source."
          }
          foreach ($test in ($sabotages | ForEach-Object { $_.Test } | Sort-Object -Unique)) {
            if (-not (Test-ResultLine $restored.Log $test 'ok')) {
              throw "Gate did not run and pass on the restored source: $test"
            }
          }
          node scripts/test-link-routing.mjs
          git diff --exit-code -- crates/neural-app/src
      - name: Exercise ChatGPT/Claude auto-submit runtime
        run: node scripts/test-ai-auto-submit.mjs
      - name: Exercise shipped provider link routing
        run: node scripts/test-link-routing.mjs
      - run: cargo clippy --locked -p neural-app --all-targets -- -D warnings
      - run: cargo build --locked -p neural-app --bin NeuralIA --release
      - name: First comparator paint without mouse or keyboard
        shell: pwsh
        run: ./scripts/test-comparator-first-paint.ps1 -ExePath target/release/NeuralIA.exe
      - name: Native Home performance regression gate
        shell: pwsh
        run: ./scripts/measure-home.ps1 -ExePath target/release/NeuralIA.exe -OutputPath perf-home.json
      - name: WebView lifecycle regression gate
        shell: pwsh
        run: ./scripts/measure-cycles.ps1 -ExePath target/release/NeuralIA.exe -Cycles 5 -OutputPath perf-cycles.json
      - name: Stage the exact tested release candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-tested | Out-Null
          Copy-Item target/release/NeuralIA.exe ci-tested/NeuralIA.exe
          Copy-Item perf-home.json ci-tested/perf-home.json
          Copy-Item perf-cycles.json ci-tested/perf-cycles.json
          $hash = (Get-FileHash ci-tested/NeuralIA.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NeuralIA.exe" | Out-File -Encoding ascii ci-tested/NeuralIA.exe.sha256
      # Release contract of the CI-only accelerator spike (infra-accel-spike):
      # the exact bytes that release.yml packages were built without the spike
      # feature, so the spike marker is not in them.
      - name: Published exe has the accel-spike feature off
        shell: pwsh
        run: ./scripts/test-accel-spike-marker.ps1 -ExePath ci-tested/NeuralIA.exe -Expect Absent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neuralia-windows-tested-${{ github.sha }}
          path: ci-tested/
          if-no-files-found: error
          retention-days: 7

  installer-smoke:
    needs: windows
    runs-on: windows-latest
    # The installer is neural-setup, compiled here around the CI-tested
    # NeuralIA.exe: the first release build of the workspace dependencies
    # dominates, each later installer build only recompiles neural-setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neuralia-windows-tested-${{ github.sha }}
          path: ci-tested
      - name: Prove cargo never sees the signing secrets and packs the exact payload
        shell: pwsh
        run: |
          # A fake cargo records what every cargo call of the build script can
          # see: never NEURALIA_AUTHENTICODE_* (build scripts and proc-macros
          # inherit cargo's environment), always exactly the -ExePath bytes.
          ./scripts/test-build-installer-isolation.ps1
      - name: Prove the installer build refuses a version it would not register
        shell: pwsh
        run: |
          # neural-setup writes the workspace version to Windows Apps. An
          # installer named for any other version would lie about itself.
          $refused = $false
          try {
            ./scripts/build-windows-installer.ps1 -ExePath ci-tested/NeuralIA.exe -Version 0.0.1 -OutputDir version-mismatch
          }
          catch {
            if ($_.Exception.Message -match "does not match the workspace version") {
              $refused = $true
              Write-Host "Version gate: mismatched -Version was refused: $($_.Exception.Message)"
            }
            else {
              throw
            }
          }
          if (-not $refused) {
            throw "Installer build accepted -Version 0.0.1, which differs from the workspace version."
          }
          if (Test-Path -LiteralPath version-mismatch/NeuralIA-Setup-0.0.1-x64.exe) {
            throw "A refused build still produced an installer."
          }
      - name: Build unsigned installer candidate
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          ./scripts/build-windows-installer.ps1 -ExePath ci-tested/NeuralIA.exe -Version $version -OutputDir ci-installer
      - name: Smoke install exact CI-tested payload
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          $installer = Get-ChildItem ci-installer -Filter "NeuralIA-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer candidate was not produced." }
          ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedExePath ci-tested/NeuralIA.exe -ExpectedVersion $version
      - name: Exercise Authenticode path with an ephemeral CI certificate
        # Rebuilds neural-setup (only that crate) and runs the full smoke.
        timeout-minutes: 8
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          $ephemeralSecret = [Guid]::NewGuid().ToString("N") + [Guid]::NewGuid().ToString("N")
          $ephemeralSecureSecret = ConvertTo-SecureString $ephemeralSecret -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP "neuralia-ci-authenticode.pfx"
          $cert = $null

          try {
            Write-Host "[authenticode-ci] generating ephemeral code-signing certificate"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NeuralIA CI Authenticode Test" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)

            Write-Host "[authenticode-ci] exporting ephemeral certificate"
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $ephemeralSecureSecret | Out-Null

            $env:NEURALIA_AUTHENTICODE_PFX_B64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxPath))
            $env:NEURALIA_AUTHENTICODE_PFX_PASSWORD = $ephemeralSecret

            # A self-signed CI leaf deliberately has no public trust chain.
            # We verify its cryptographic signature and expected thumbprint,
            # while stable release still requires /pa trust + RFC3161 timestamp.
            Write-Host "[authenticode-ci] building and signing installer"
            ./scripts/build-windows-installer.ps1 -ExePath ci-tested/NeuralIA.exe -Version $version -OutputDir signed-ci-installer -Sign -SkipTimestamp -AllowUntrustedTestCertificate

            # The certificate existed before build-windows-installer imported
            # the PFX. The helper must not delete pre-existing store entries
            # during cleanup.
            if (-not (Test-Path -LiteralPath ("Cert:\\CurrentUser\\My\\" + $cert.Thumbprint))) {
              throw "Signing helper removed a pre-existing certificate from CurrentUser\\My."
            }

            $installer = Get-ChildItem signed-ci-installer -Filter "NeuralIA-Setup-*-x64.exe" -File | Select-Object -First 1
            if (-not $installer) { throw "Signed CI installer was not produced." }

            # The signed setup must still install the exact CI-tested payload.
            ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedExePath ci-tested/NeuralIA.exe -ExpectedVersion $version

            # Signature sabotage proof: flip one byte in the signed PE body.
            # The verifier must reject HashMismatch/invalid signature even when
            # untrusted test certificates are otherwise allowed.
            $tampered = Join-Path $env:RUNNER_TEMP "NeuralIA-Setup-tampered.exe"
            Copy-Item $installer.FullName $tampered
            $bytes = [IO.File]::ReadAllBytes($tampered)
            if ($bytes.Length -le 1024) { throw "Installer unexpectedly too small for signature sabotage." }
            $bytes[1024] = $bytes[1024] -bxor 0x01
            [IO.File]::WriteAllBytes($tampered, $bytes)

            $signatureRejected = $false
            try {
              ./scripts/verify-windows-installer-signature.ps1 -InstallerPath $tampered -ExpectedThumbprint $cert.Thumbprint -AllowUntrustedTestCertificate
            }
            catch {
              $signatureRejected = $true
              Write-Host "Signature sabotage proof: tampered signed installer was rejected: $($_.Exception.Message)"
            }
            if (-not $signatureRejected) {
              throw "Authenticode gate stayed green after the signed installer was tampered."
            }
            Remove-Item -LiteralPath $tampered -Force -ErrorAction SilentlyContinue
          }
          finally {
            $env:NEURALIA_AUTHENTICODE_PFX_B64 = $null
            $env:NEURALIA_AUTHENTICODE_PFX_PASSWORD = $null
            if ($cert) {
              Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Prove installer gate rejects a substituted payload
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force sabotage | Out-Null
          Copy-Item ci-tested/NeuralIA.exe sabotage/NeuralIA.exe
          $stream = [IO.File]::Open((Resolve-Path sabotage/NeuralIA.exe).Path, [IO.FileMode]::Append, [IO.FileAccess]::Write)
          try { $stream.WriteByte(0) } finally { $stream.Dispose() }

          ./scripts/build-windows-installer.ps1 -ExePath sabotage/NeuralIA.exe -Version $version -OutputDir sabotage-installer
          $installer = Get-ChildItem sabotage-installer -Filter "NeuralIA-Setup-*-x64.exe" -File | Select-Object -First 1

          $caughtExpectedFailure = $false
          try {
            ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedExePath ci-tested/NeuralIA.exe -ExpectedVersion $version
          }
          catch {
            if ($_.Exception.Message -match "differs from the CI-tested payload") {
              $caughtExpectedFailure = $true
              Write-Host "Sabotage proof: substituted payload was rejected."
            }
            else {
              throw
            }
          }

          if (-not $caughtExpectedFailure) {
            throw "Installer gate stayed green after payload substitution."
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neuralia-installer-unsigned-${{ github.sha }}
          path: ci-installer/*.exe
          if-no-files-found: error
          retention-days: 3

  attest-tested-binary:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neuralia-windows-tested-${{ github.sha }}
          path: ci-tested
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-tested/NeuralIA.exe

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          command: check bans licenses sources
          arguments: --all-features --locked

  accel-spike:
    # infra-accel-spike (2.3 plan, CI only). A release exe WITH the CI-only
    # cargo feature `accel-spike`: an AcceleratorKeyPressed with Handled=TRUE
    # on every WebView kind, driven by scripts/test-accel-spike.ps1, which
    # prints the per-host table and fails if any default native chord fails
    # the pass rule (page keydown never sees it, no NEURALIA_KEYMAP_SCRIPT
    # act() fires, the native side fires exactly once, auto-repeat included).
    # This exe never leaves the job: no upload-artifact, and no job needs it.
    # The published exe is the `windows` job's, built without the feature
    # (test-accel-spike-marker.ps1 -Expect Absent there).
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - run: cargo clippy --locked -p neural-app --all-targets --features accel-spike -- -D warnings
      - run: cargo test --locked -p neural-app --features accel-spike accel_spike
      - name: Spike evaluator self-test (pass rule on synthetic trials)
        shell: pwsh
        run: ./scripts/test-accel-spike.ps1 -SelfTest
      - run: cargo build --locked -p neural-app --bin NeuralIA --release --features accel-spike
      - name: The spike exe carries the marker the release gate looks for
        shell: pwsh
        run: ./scripts/test-accel-spike-marker.ps1 -ExePath target/release/NeuralIA.exe -Expect Present
      - name: Accelerator spike E2E on the release exe (per-host table)
        shell: pwsh
        run: ./scripts/test-accel-spike.ps1 -ExePath target/release/NeuralIA.exe -TablePath accel-spike-table.md
      # Proves the probe (AGENTS.md 4.2): with Handled=false the same E2E must
      # report that the page saw the key. Runs even when the table failed, so
      # a red table always comes with the proof that the probe can see a leak.
      - name: Sabotage Handled=false must make the E2E report that the page saw the key
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = [Text.UTF8Encoding]::new($false)
          $resolved = (Resolve-Path -LiteralPath "crates/neural-app/src/accel_spike_app.rs").Path
          $original = [IO.File]::ReadAllText($resolved, $utf8)
          $old = 'unsafe { args.SetHandled(verdict.handled)? };'
          $count = ([regex]::Matches($original, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Sabotage target expected once, found $count." }
          try {
            [IO.File]::WriteAllText($resolved, $original.Replace($old, 'unsafe { args.SetHandled(false)? };'), $utf8)
            cargo build --locked -p neural-app --bin NeuralIA --release --features accel-spike
            if ($LASTEXITCODE -ne 0) { throw "The sabotaged spike build failed." }
            ./scripts/test-accel-spike.ps1 -ExePath target/release/NeuralIA.exe -ExpectLeak -Hosts External,Reader -TablePath accel-spike-sabotage.md
          }
          finally {
            git checkout -- crates/neural-app/src
          }
          git diff --exit-code -- crates/neural-app/src
