name: Bootstrap PDF.js assets for issue 68

on:
  push:
    branches: [feat/pdfjs-aux-assets-68]
    paths:
      - '.github/workflows/bootstrap-pdf68-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/pdfjs-aux-assets-68
          fetch-depth: 0
      - name: Fetch exact PDF.js 6.3.289 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.3.289 https://github.com/mozilla/pdf.js.git "$RUNNER_TEMP/pdfjs"
          test "$(git -C "$RUNNER_TEMP/pdfjs" rev-parse HEAD)" = "1c8020a7d4e43668ac287a3ecf9a8dbea17e4c56"
      - name: Copy auxiliary assets exactly
        shell: bash
        run: |
          set -euo pipefail
          UP="$RUNNER_TEMP/pdfjs/external"
          rm -rf assets/pdfjs/cmaps assets/pdfjs/standard_fonts assets/pdfjs/icc assets/pdfjs/wasm
          mkdir -p assets/pdfjs/cmaps assets/pdfjs/standard_fonts assets/pdfjs/icc assets/pdfjs/wasm

          cp "$UP"/bcmaps/*.bcmap assets/pdfjs/cmaps/
          cp "$UP"/bcmaps/LICENSE assets/pdfjs/cmaps/

          cp "$UP"/standard_fonts/Foxit*.pfb assets/pdfjs/standard_fonts/
          cp "$UP"/standard_fonts/LiberationSans-*.ttf assets/pdfjs/standard_fonts/
          cp "$UP"/standard_fonts/LICENSE_FOXIT assets/pdfjs/standard_fonts/
          cp "$UP"/standard_fonts/LICENSE_LIBERATION assets/pdfjs/standard_fonts/

          cp "$UP"/iccs/CGATS001Compat-v2-micro.icc assets/pdfjs/icc/
          cp "$UP"/iccs/LICENSE assets/pdfjs/icc/

          cp "$UP"/openjpeg/openjpeg.wasm assets/pdfjs/wasm/
          cp "$UP"/openjpeg/openjpeg_nowasm_fallback.js assets/pdfjs/wasm/
          cp "$UP"/openjpeg/LICENSE_OPENJPEG assets/pdfjs/wasm/
          cp "$UP"/openjpeg/LICENSE_PDFJS_OPENJPEG assets/pdfjs/wasm/

          cp "$UP"/jbig2/jbig2.wasm assets/pdfjs/wasm/
          cp "$UP"/jbig2/jbig2_nowasm_fallback.js assets/pdfjs/wasm/
          cp "$UP"/jbig2/LICENSE_JBIG2 assets/pdfjs/wasm/
          cp "$UP"/jbig2/LICENSE_PDFJS_JBIG2 assets/pdfjs/wasm/

          cp "$UP"/qcms/qcms_bg.wasm assets/pdfjs/wasm/
          cp "$UP"/qcms/LICENSE_QCMS assets/pdfjs/wasm/
          cp "$UP"/qcms/LICENSE_PDFJS_QCMS assets/pdfjs/wasm/

          test "$(find assets/pdfjs/cmaps -type f | wc -l)" -eq 169
          test "$(find assets/pdfjs/standard_fonts -type f | wc -l)" -eq 16
          test "$(find assets/pdfjs/icc -type f | wc -l)" -eq 2
          test "$(find assets/pdfjs/wasm -type f | wc -l)" -eq 11
          test "$(find assets/pdfjs/cmaps assets/pdfjs/standard_fonts assets/pdfjs/icc assets/pdfjs/wasm -type f | wc -l)" -eq 198
      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NeuralIA web agent"
          git config user.email "web-agent@users.noreply.github.com"
          git add assets/pdfjs/cmaps assets/pdfjs/standard_fonts assets/pdfjs/icc assets/pdfjs/wasm
          git commit -m "vendor: add PDF.js 6.3.289 auxiliary assets"
          git push origin HEAD:feat/pdfjs-aux-assets-68
