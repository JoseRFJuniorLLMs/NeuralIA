name: PDF viewer

on:
  pull_request:
    paths:
      - 'assets/pdfjs/**'
      - 'scripts/test-pdf-viewer.mjs'
      - 'scripts/test-pdfjs-aux-assets.mjs'
      - 'crates/neural-app/src/pdf_assets.rs'
      - 'crates/neural-app/src/windows_app.rs'
      - '.github/workflows/pdf-viewer.yml'
  push:
    branches: [main]
    paths:
      - 'assets/pdfjs/**'
      - 'scripts/test-pdf-viewer.mjs'
      - 'scripts/test-pdfjs-aux-assets.mjs'
      - 'crates/neural-app/src/pdf_assets.rs'
      - 'crates/neural-app/src/windows_app.rs'
      - '.github/workflows/pdf-viewer.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise shipped PDF viewer behavior
        run: node scripts/test-pdf-viewer.mjs
      - name: Exercise real auxiliary PDF.js paths
        run: node scripts/test-pdfjs-aux-assets.mjs
      - name: Prove JPX gate needs local WASM/fallback assets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NEURALIA_PDF_AUX_CASE=jpx NEURALIA_PDF_AUX_BREAK=wasm node scripts/test-pdfjs-aux-assets.mjs
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "JPX sabotage unexpectedly stayed green without the WASM asset base" >&2
            exit 1
          fi
          echo "Sabotage proof: JPX failed without its auxiliary WASM/fallback base."
      - name: Prove CID gate needs local packed CMaps
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NEURALIA_PDF_AUX_CASE=cid-cmap NEURALIA_PDF_AUX_BREAK=cmap node scripts/test-pdfjs-aux-assets.mjs
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "CID/CMap sabotage unexpectedly stayed green without the CMap base" >&2
            exit 1
          fi
          echo "Sabotage proof: CID/CMap fixture failed without packed CMaps."
      - name: Prove standard-font gate needs vendored font data
        shell: bash
        run: |
          set -euo pipefail
          set +e
          NEURALIA_PDF_AUX_CASE=standard-fonts NEURALIA_PDF_AUX_BREAK=font node scripts/test-pdfjs-aux-assets.mjs
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Standard-font sabotage unexpectedly stayed green without font data" >&2
            exit 1
          fi
          echo "Sabotage proof: standard-font fixture failed without vendored font data."
      - name: Prove ICC allowlist gate catches a removed profile
        shell: bash
        run: |
          set -euo pipefail
          cp crates/neural-app/src/pdf_assets.rs "$RUNNER_TEMP/pdf_assets.rs.clean"
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/neural-app/src/pdf_assets.rs")
          text = path.read_text(encoding="utf-8")
          arm = '''        "/icc/CGATS001Compat-v2-micro.icc" => (
            "application/vnd.iccprofile",
            include_bytes!("../../../assets/pdfjs/icc/CGATS001Compat-v2-micro.icc"),
        ),
'''
          if text.count(arm) != 1:
              raise SystemExit("ICC sabotage arm not found exactly once")
          path.write_text(text.replace(arm, "", 1), encoding="utf-8")
          PY
          set +e
          cargo test --locked -p neural-app pdf_assets::tests::auxiliary_asset_lookup_is_fail_closed
          result=$?
          set -e
          cp "$RUNNER_TEMP/pdf_assets.rs.clean" crates/neural-app/src/pdf_assets.rs
          if [ "$result" -eq 0 ]; then
            echo "ICC allowlist sabotage unexpectedly stayed green" >&2
            exit 1
          fi
          echo "Sabotage proof: removing the ICC profile route turns the gate red."
      - name: Prove the status gate catches a regression
        shell: bash
        run: |
          set -euo pipefail
          sabotage="$RUNNER_TEMP/neuralia-pdf-sabotage"
          mkdir -p "$sabotage"
          cp assets/pdfjs/viewer.mjs "$sabotage/viewer.mjs"
          cp assets/pdfjs/pdf.mjs "$sabotage/pdf.mjs"

          python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "element.style.display = 'none';"
          new = "element.style.display = 'grid';"
          if text.count(old) != 1:
              raise SystemExit("sabotage target not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          module_uri="$(python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys
          print(Path(sys.argv[1]).resolve().as_uri())
          PY
          )"

          set +e
          NEURALIA_PDF_VIEWER_MODULE="$module_uri" node scripts/test-pdf-viewer.mjs
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "PDF viewer sabotage unexpectedly stayed green" >&2
            exit 1
          fi
          echo "Sabotage proof: mutated hideStatus was rejected with exit code $result."
      - name: Prove the load-error classifier gate catches a regression
        shell: bash
        run: |
          set -euo pipefail
          sabotage="$RUNNER_TEMP/neuralia-pdf-error-sabotage"
          mkdir -p "$sabotage"
          cp assets/pdfjs/viewer.mjs "$sabotage/viewer.mjs"
          cp assets/pdfjs/pdf.mjs "$sabotage/pdf.mjs"

          python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "return 'Não consegui obter o PDF:' + status + (status ? '' : ' ' + text);"
          new = "return 'Este ficheiro não é um PDF que eu consiga abrir: ' + text;"
          if text.count(old) != 1:
              raise SystemExit("load-error sabotage target not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          module_uri="$(python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys
          print(Path(sys.argv[1]).resolve().as_uri())
          PY
          )"

          set +e
          NEURALIA_PDF_VIEWER_MODULE="$module_uri" node scripts/test-pdf-viewer.mjs
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "PDF load-error classifier sabotage unexpectedly stayed green" >&2
            exit 1
          fi
          echo "Sabotage proof: mutated ResponseException classification was rejected with exit code $result."
      - name: Prove the password-error gate catches a regression
        shell: bash
        run: |
          set -euo pipefail
          sabotage="$RUNNER_TEMP/neuralia-pdf-password-sabotage"
          mkdir -p "$sabotage"
          cp assets/pdfjs/viewer.mjs "$sabotage/viewer.mjs"
          cp assets/pdfjs/pdf.mjs "$sabotage/pdf.mjs"

          python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "return 'Este PDF está protegido por senha e o NeuralIA ainda não consegue abri-lo.';"
          new = "return 'Este ficheiro não é um PDF que eu consiga abrir: ' + text;"
          if text.count(old) != 1:
              raise SystemExit("password sabotage target not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          module_uri="$(python - "$sabotage/viewer.mjs" <<'PY'
          from pathlib import Path
          import sys
          print(Path(sys.argv[1]).resolve().as_uri())
          PY
          )"

          set +e
          NEURALIA_PDF_VIEWER_MODULE="$module_uri" node scripts/test-pdf-viewer.mjs
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "PDF password classifier sabotage unexpectedly stayed green" >&2
            exit 1
          fi
          echo "Sabotage proof: mutated PasswordException classification was rejected with exit code $result."
