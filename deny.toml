[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "serde", reason = "SABOTAGE: prove dependency-policy gate goes red" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
