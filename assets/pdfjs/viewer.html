<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NeuralIA · PDF</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; background: #16181a; color: #e9ecef;
    font: 13px "Segoe UI", system-ui, sans-serif;
  }
  #pages {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 24px 16px 64px;
  }
  .page {
    position: relative; background: #fff; border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
  }
  .page canvas { display: block; border-radius: 4px; }
  .page .num {
    position: absolute; right: 10px; bottom: 8px; padding: 2px 8px;
    border-radius: 999px; background: rgba(17, 19, 20, .75); color: #e9ecef;
    font-size: 11px; font-weight: 600; pointer-events: none;
  }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; z-index: 10;
    background: rgba(17, 19, 20, .92); font-weight: 600; pointer-events: none;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #9aa1a8; font-size: 15px;
  }
  #status.error { color: #e07b6f; }
</style>
</head>
<body>
<div id="status">A carregar o PDF…</div>
<div id="hud" hidden></div>
<div id="pages"></div>
<script type="module" src="./viewer.mjs"></script>
</body>
</html>
