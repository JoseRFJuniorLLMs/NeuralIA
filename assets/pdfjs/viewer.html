<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' blob: data:; style-src 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NeuralIA · PDF</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; background: #16181a; color: #e9ecef;
    font: 13px "Segoe UI", system-ui, sans-serif;
  }
  #pages {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 24px 16px 64px;
  }
  .page {
    position: relative; background: #fff; border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
  }
  .page canvas { display: block; border-radius: 4px; }
  .page .num {
    position: absolute; right: 10px; bottom: 8px; padding: 2px 8px;
    border-radius: 999px; background: rgba(17, 19, 20, .75); color: #e9ecef;
    font-size: 11px; font-weight: 600; pointer-events: none;
  }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; z-index: 10;
    background: rgba(17, 19, 20, .92); font-weight: 600; pointer-events: none;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #9aa1a8; font-size: 15px;
  }
  #status.error { color: #e07b6f; }
  /* Camada de texto do PDF.js: texto transparente sobre o canvas, para
     selecionar e para a leitura em voz alta realcar a frase lida. Regras
     adaptadas do pdf_viewer.css do PDF.js 6.3.289 (Apache-2.0, LICENSE nesta
     pasta); o viewer.mjs escreve --scale-factor em #pages. */
  .page {
    --user-unit: 1;
    --total-scale-factor: calc(var(--scale-factor, 1) * var(--user-unit));
    --scale-round-x: 1px;
    --scale-round-y: 1px;
  }
  .textLayer {
    position: absolute; inset: 0; overflow: clip; z-index: 0;
    text-align: initial; opacity: 1; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none;
    transform-origin: 0 0; caret-color: CanvasText;
    --min-font-size: 1;
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size));
  }
  .textLayer :is(span, br) {
    color: transparent; position: absolute; white-space: pre;
    cursor: text; transform-origin: 0% 0%;
  }
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1;
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1;
    --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(0, 110, 255, .3); }
  .textLayer br::selection { background: transparent; }
</style>
</head>
<body>
<div id="status">A carregar o PDF…</div>
<div id="hud" hidden></div>
<div id="pages"></div>
<script src="./read-aloud.js"></script>
<script type="module" src="./viewer.mjs"></script>
</body>
</html>
