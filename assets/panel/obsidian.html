<div class="view" id="view-obsidian" hidden>
<div class="row">
  <input id="oq" class="field" placeholder="Buscar no grafo (notas, sites, histórico, tags)" autocomplete="off" spellcheck="false">
  <button id="obsidian-reset" class="btn" title="Centralizar visualização">Centralizar</button>
  <button id="obsidian-refresh" class="btn primary" title="Atualizar dados">Atualizar</button>
</div>
<div id="obsidian-stats" class="meta" style="padding:0 18px 6px;display:flex;justify-content:space-between;align-items:center;">
  <span id="obsidian-counts">Carregando grafo...</span>
  <span class="obsidian-legend">
    <span class="dot dot-note"></span> Notas
    <span class="dot dot-site"></span> Sites
    <span class="dot dot-hist"></span> Histórico
    <span class="dot dot-tag"></span> Tags
  </span>
</div>
<div id="obsidian-container">
  <canvas id="obsidian-canvas"></canvas>
  <div id="obsidian-card" class="confirm" hidden>
    <div style="flex:1;min-width:0;">
      <div id="obsidian-card-title" class="title" style="font-weight:600;"></div>
      <div id="obsidian-card-detail" class="detail"></div>
    </div>
    <button id="obsidian-card-action" class="btn primary">Abrir</button>
    <button id="obsidian-card-close" class="btn">✕</button>
  </div>
</div>
</div>
